<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema Guarda BJJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<script>try { var saved = JSON.parse(localStorage.getItem('sg-settings')); if (saved && saved.theme) document.documentElement.dataset.theme = saved.theme; } catch (e) {}</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <div class="brand"><span class="belt" aria-hidden="true"></span><h1 id="appTitle">Sistema Guarda</h1></div>
      <input type="search" class="search" id="search" placeholder="Buscar técnica" aria-label="Buscar técnica" autocomplete="off" enterkeyhint="search">
      <div class="tools">
        <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button></div>
        <button type="button" class="pill icon-only" id="theme"></button>
        <a class="pill" id="adminLink" href="admin.html" hidden>Admin</a>
        <button type="button" class="pill" id="account" hidden>Entrar</button>
      </div>
    </div>
    <nav id="nav" aria-label="Módulos"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panelTitle"></aside>
</body>
</html>
