/* Layout: sticky header with module tabs; each module is a vertical "spine" of stages with technique chips; detail opens in a side panel (bottom sheet on phones). Belt colors encode level. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#141B2B; --muted:#5A6375; --line:#D8DDE6;
  --lv-b:#2D6BD3; --lv-b-soft:#E3ECFB; --lv-a:#6A3EA1; --lv-a-soft:#EEE6F7;
  --accent:#C4262E; --spine:#B9C1CF; --shadow:0 10px 30px rgba(20,27,43,.12);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#171E2D; --ink:#E7EBF2; --muted:#9AA3B6; --line:#283146;
  --lv-b:#78A4F2; --lv-b-soft:#1C2A45; --lv-a:#B08AE0; --lv-a-soft:#2A2140;
  --accent:#EF5A61; --spine:#3A4560; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#171E2D; --ink:#E7EBF2; --muted:#9AA3B6; --line:#283146;
  --lv-b:#78A4F2; --lv-b-soft:#1C2A45; --lv-a:#B08AE0; --lv-a-soft:#2A2140;
  --accent:#EF5A61; --spine:#3A4560; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.belt{width:34px;height:12px;border-radius:2px;background:var(--ink);position:relative;flex:none}
.belt::after{content:"";position:absolute;right:5px;top:0;bottom:0;width:9px;background:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:8px 0;scrollbar-width:none}
nav a{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 12px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:24px 64px}
.intro{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;justify-content:space-between;margin-bottom:20px}
.intro h2{font-family:var(--display);font-size:40px;line-height:1;margin:0 0 6px;text-transform:uppercase;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chipbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:18px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:8px;border-radius:2px}
.sw.b{background:var(--lv-b)} .sw.a{background:var(--lv-a)}
/* spine */
.spine{position:relative;display:grid;gap:18px}
.stage{position:relative;display:grid;grid-template-columns:44px 1fr;gap:14px}
.stage::before{content:"";position:absolute;left:21px;top:44px;bottom:-18px;width:2px;background:var(--spine)}
.stage:last-child::before{display:none}
.node{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;z-index:1}
.stage-body{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stage-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.stage-head h3{font-family:var(--display);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.goal{color:var(--muted);font-size:13.5px}
.techs{display:flex;flex-wrap:wrap;gap:8px}
.tech{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:7px 11px 7px 0;font:500 14px var(--body);cursor:pointer;text-align:left;overflow:hidden}
.tech::before{content:"";align-self:stretch;width:5px;margin:-7px 0}
.tech.b::before{background:var(--lv-b)} .tech.a::before{background:var(--lv-a)}
.tech:hover{border-color:var(--ink)}
.tech[hidden]{display:none!important}
.mine{font:600 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.gtag{font:700 10px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.games{margin-top:28px}
.sect-title{font-family:var(--display);font-size:28px;text-transform:uppercase;margin:0 0 4px}
.sect-sub{color:var(--muted);margin:0 0 14px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h4{margin:0 0 6px;font-size:15.5px}
.card p{margin:0;color:var(--muted);font-size:14px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:8px;font-size:13.5px}
.rule b{font-weight:600}
/* panel */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:20}
.panel{position:fixed;z-index:21;background:var(--surface);box-shadow:var(--shadow);overflow:auto;
  right:0;top:0;bottom:0;width:min(420px,100%);padding:24px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 22px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
@media (max-width:640px){.panel{top:auto;left:0;width:100%;max-height:82vh;border-radius:16px 16px 0 0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-top:20px}}
.panel .lv{display:inline-block;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.lv.b{background:var(--lv-b-soft);color:var(--lv-b)} .lv.a{background:var(--lv-a-soft);color:var(--lv-a)}
.panel h3{font-family:var(--display);font-size:32px;line-height:1.05;margin:10px 0 4px;text-transform:uppercase}
.panel .from{color:var(--muted);font-size:13px;margin-bottom:14px}
.panel h5{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.panel p{margin:0}
.steplist{margin:0;padding-left:20px;display:grid;gap:4px}
.close{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:34px;height:34px;font-size:18px;cursor:pointer}
@media (max-width:640px){.close{top:12px}}
.next{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
/* method */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-top:4px solid var(--ink)}
.step .n{font-family:var(--display);font-size:30px;line-height:1;color:var(--accent)}
.step h4{margin:4px 0 4px;font-size:16px}
.step p{margin:0;color:var(--muted);font-size:14px}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:28px;background:var(--surface)}
.ladder div{padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.ladder div:last-child{border-right:0}
.ladder .pct{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.ladder p{margin:0;font-size:13px;color:var(--muted)}
.lad-bar{height:6px;border-radius:3px;background:var(--line);margin:6px 0 8px;overflow:hidden}
.lad-bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:640px){.ladder{grid-template-columns:1fr 1fr}.ladder div:nth-child(2){border-right:0}.ladder div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.principles{counter-reset:p;display:grid;gap:8px;padding:0;margin:0 0 28px;list-style:none}
.principles li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px 12px 52px;position:relative}
.principles li::before{counter-increment:p;content:counter(p);position:absolute;left:16px;top:10px;font-family:var(--display);font-size:24px;font-weight:700;color:var(--accent)}
.principles b{display:block}
.principles span{color:var(--muted);font-size:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:28px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
/* builder */
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:820px){.builder{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
select{width:100%;font:500 14px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.picks{display:grid;gap:4px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg)}
.picks label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;font-size:14px;cursor:pointer}
.picks label:hover{background:var(--surface)}
.picks .grp{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 6px 2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.b{background:var(--lv-b)} .dot.a{background:var(--lv-a)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.plan h3{font-family:var(--display);font-size:26px;text-transform:uppercase;margin:0 0 2px}
.plan .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
.block{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.block .t{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--accent)}
.block h4{margin:0 0 2px;font-size:15px}
.block p,.block ul{margin:0;color:var(--muted);font-size:14px}
.block ul{padding-left:18px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.primary{border:0;background:var(--ink);color:var(--surface);font:600 14px var(--body);padding:9px 16px;border-radius:8px;cursor:pointer}
.status{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
@media (max-width:640px){h1{font-size:22px}.intro h2{font-size:32px}.stage{grid-template-columns:36px 1fr;gap:10px}.node{width:36px;height:36px;font-size:17px}.stage::before{left:17px;top:36px}}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateY(12px);opacity:.6}}}
</style>

   ]},
   {name:{pt:'Passagens complementares',en:'Complementary passes'},goal:{pt:'Opções modernas contra guardas abertas.',en:'Modern options against open guards.'},items:[
    {lv:'b',n:{pt:'Toreando',en:'Toreando (bullfighter)'},d:{pt:'Segure as calças nos joelhos, empurre as pernas para um lado e corra para o outro.',en:'Grip the pants at the knees, push the legs to one side and run to the other.'},t:{pt:'Troque de lado se ele acompanhar.',en:'Switch sides if he follows.'}},
    {lv:'b',n:{pt:'Joelho cortando',en:'Knee cut'},d:{pt:'O joelho atravessa a coxa dele até o chão, com underhook do lado da cabeça.',en:'Slide your knee across his thigh to the mat with an underhook on the head side.'},t:{pt:'Controle o braço de baixo para ele não pegar as costas.',en:"Control his far arm so he can't take your back."}},
    {lv:'b',n:{pt:'Passagem por baixo das pernas',en:'Double-under pass'},d:{pt:'Os dois braços por baixo das pernas, empilhe o quadril e contorne.',en:'Both arms under his legs, stack his hips and walk around.'},t:{pt:'Cabeça colada na barriga dele contra o triângulo.',en:'Head tight to his belly to avoid triangles.'}},
    {lv:'a',n:{pt:'Leg drag',en:'Leg drag'},d:{pt:'Puxe uma perna dele por cima do seu quadril e cole o peito de lado.',en:'Drag one of his legs across your hip and pin chest to side.'},t:{pt:'Quadril dele virado = guarda sem força.',en:'His hips turned away = a guard with no power.'}},
    {lv:'a',n:{pt:'X-pass',en:'X-pass'},d:{pt:'Passo cruzado para o lado das pernas, mudando o ângulo rápido.',en:'Cross-step to the side of his legs, changing the angle fast.'},t:{pt:'Bom contra guardas abertas com pés no quadril.',en:'Good against open guards with feet on the hips.'}},
    {lv:'a',n:{pt:'Over-under',en:'Over-under'},d:{pt:'Um braço por cima e outro por baixo das pernas, ombro esmagando a coxa.',en:'One arm over and one under his legs, shoulder smashing the thigh.'},t:{pt:'Paciência: pressão primeiro, passagem depois.',en:'Patience: pressure first, pass second.'}},
    {lv:'a',n:{pt:'Body lock',en:'Body lock'},d:{pt:'Abrace o quadril, prenda as pernas dele entre as suas e passe pela meia-guarda.',en:'Lock your hands around his hips, trap his legs and pass through half guard.'},t:{pt:'Muito usado no sem kimono.',en:'Very common in no-gi.'}},
    {lv:'a',n:{pt:'Esmagar a meia-guarda',en:'Half guard smash pass'},d:{pt:'Underhook e peso no peito, tire o joelho escudo e solte sua perna.',en:'Underhook and chest weight, clear the knee shield and free your leg.'},t:{pt:'Ganhe o underhook antes dele.',en:'Win the underhook before he does.'}}
   ]},
   {name:{pt:'Side control (montada atravessada)',en:'Side control'},goal:{pt:'Segurar 3 segundos antes de atacar.',en:'Hold for 3 seconds before attacking.'},items:[
    {lv:'b',mine:1,n:{pt:'Side control 1 · básico',en:'Side control 1 · basic'},d:{pt:'Braço esquerdo controla a cabeça por cima do corpo, braço direito por baixo da perna.',en:'Left arm controls the head over the body, right arm under his leg.'},t:{pt:'Primeira posição depois de passar.',en:'First position after the pass.'}},
    {lv:'b',mine:1,n:{pt:'Side control 2 · peito com peito',en:'Side control 2 · chest to chest'},d:{pt:'Os dois braços do outro lado do corpo dele, joelhos apertando, peito no peito.',en:'Both arms to the far side, knees pinching, chest on chest.'},t:{pt:'Base de retorno quando ele reage. Relaxe o peso: corpo relaxado pesa mais.',en:'Home base when he reacts. Relax your weight: a relaxed body feels heavier.'}},
    {lv:'a',mine:1,n:{pt:'Side control 3 · headlock',en:'Side control 3 · headlock'},d:{pt:'Braço sob a cabeça como travesseiro, braço sob a axila, joelho trava o quadril, perna em sprawl e pressão de ombro.',en:'Arm under the head like a pillow, arm under the armpit, knee locks the hip, leg sprawled, shoulder pressure.'},t:{pt:'Ombro pressiona o queixo dele.',en:'Shoulder presses into his jaw.'}},
    {lv:'a',mine:1,n:{pt:'Side control 4 · kesa "home"',en:'Side control 4 · "home" kesa'},d:{pt:'Variação de kesa gatame do seu sistema. Anote o detalhe que a diferencia da nº 5.',en:'Kesa gatame variation in your system. Note the detail that sets it apart from No. 5.'},t:{pt:'Combine com o aluno qual é a diferença.',en:'Agree with your student on the difference.'}},
    {lv:'a',mine:1,n:{pt:'Side control 5 · kesa gatame',en:'Side control 5 · scarf hold'},d:{pt:'Sentado de lado, braço dele preso e cabeça controlada.',en:'Sitting sideways, his arm trapped and head controlled.'},t:{pt:'Ele reage? Passe a perna sobre a cabeça e volte ao 2.',en:'He reacts? Step over the head and go back to No. 2.'}},
    {lv:'a',n:{pt:'Joelho na barriga',en:'Knee on belly'},d:{pt:'Joelho na barriga, pé de fora afastado, pegada na gola e na calça.',en:'Knee on his belly, far foot wide, grips on collar and pants.'},t:{pt:'Vá para a montada quando ele empurrar.',en:'Go to mount when he pushes.'}},
    {lv:'a',n:{pt:'Norte-sul',en:'North-south'},d:{pt:'Peito sobre o peito dele, de frente para os pés dele.',en:'Chest on his chest, facing his legs.'},t:{pt:'Abre kimura e armlock norte-sul.',en:'Opens the north-south kimura and armbar.'}}
   ]},
   {name:{pt:'Finalizar do side control',en:'Submit from side control'},goal:{pt:'Atacar o braço ou o pescoço que ele expõe.',en:'Attack the arm or neck he exposes.'},items:[
    {lv:'b',mine:1,g:1,n:{pt:'Kimura',en:'Kimura'},d:{pt:'Quando ele expõe o braço, prenda o pulso, segure o próprio pulso e torça o ombro com o pé prendendo a cabeça dele.',en:'When he exposes an arm, trap the wrist, grab your own wrist and rotate the shoulder with your foot pinning his head.'},
     s:[['Prenda o pulso dele.','Trap his wrist.'],['Passe a outra mão por baixo do braço e segure o próprio pulso, sentando de lado.','Thread your other hand under his arm and grab your own wrist as you sit to the side.'],['Passe a perna por cima e prenda a cabeça dele com o pé.','Step your leg over and pin his head with your foot.'],['Gire o corpo e torça o ombro.','Turn your body and rotate the shoulder.']],
     t:{pt:'O pé na cabeça é o apoio para a torção.',en:'The foot on his head is the brace for the rotation.'}},
    {lv:'b',g:1,n:{pt:'Americana',en:'Americana'},d:{pt:'Funciona no side control e na montada: punho dele no chão, braço em L, levante o cotovelo dele e arraste a mão para baixo.',en:'Works from side control and mount: his wrist on the mat, arm in an L, lift his elbow and slide the hand down.'},
     s:[['Ameace um soco para ele expor os braços.','Fake a punch so he exposes his arms.'],['Segure o pulso e encaixe seu cotovelo junto ao pescoço dele.','Grab the wrist and set your elbow tight beside his neck.'],['Passe a outra mão por baixo e segure o próprio pulso.','Thread your other hand under and grab your own wrist.'],['Levante o cotovelo dele e arraste a mão em direção ao joelho.','Lift his elbow and slide his hand toward his knee.']],
     t:{pt:'A mão dele fica sempre no chão, arrastada como um pincel.',en:'His hand stays on the mat the whole time, dragged like a paintbrush.'}},
    {lv:'b',g:1,n:{pt:'Chave de cotovelo',en:'Elbow lock'},d:{pt:'Se ele esticar o braço durante a americana, segure o próprio antebraço por baixo e levante para estender o cotovelo.',en:'If he straightens his arm during the americana, grab your own forearm underneath and lift to extend the elbow.'},t:{pt:'Mantenha o braço dele esticado.',en:'Keep his arm straight.'}},
    {lv:'b',g:1,n:{pt:'Armlock (perna sobre a cabeça)',en:'Armbar (leg over the head)'},d:{pt:'Segure o cotovelo, prenda o antebraço dele na axila, passe a perna sobre a cabeça e encaixe o calcanhar no pescoço; empurre o quadril para a frente e curve para trás.',en:'Hold the elbow, trap his forearm in your armpit, swing your leg over his head and set your heel by his neck; push your hips forward and lean back.'},t:{pt:'Segure firme o cotovelo para imobilizar.',en:'Hold the elbow firmly to immobilize it.'}},
    {lv:'a',g:1,n:{pt:'Armlock do joelho na barriga',en:'Armbar from knee on belly'},d:{pt:'Do joelho na barriga, enrole o braço dele, coloque o antebraço sob o cotovelo, segure o próprio pulso e curve para trás com o cotovelo dele apoiado na sua coxa.',en:'From knee on belly, wrap his arm, put your forearm under his elbow, grab your own wrist and lean back with his elbow on your thigh.'},t:{pt:'Antebraço exatamente embaixo do cotovelo dele.',en:'Your forearm directly under his elbow.'}},
    {lv:'a',g:1,n:{pt:'Kimura norte-sul',en:'North-south kimura'},d:{pt:'Prenda o braço segurando a sua própria gola, bloqueie a cintura e gire para o norte-sul; plante o pé, troque para a pegada da kimura e leve o pulso dele para trás.',en:'Trap the arm by gripping your own collar, block his waist and circle to north-south; post a foot, switch to the kimura grip and take his wrist back.'},t:{pt:'Ao levantar a perna, escore o outro joelho nas costas dele.',en:'When you raise a leg, brace the other knee against his back.'}},
    {lv:'a',g:1,n:{pt:'Armlock norte-sul',en:'North-south armbar'},d:{pt:'Se ele envolver seu pescoço, passe a mão por baixo do braço e segure a própria gola; vá para o norte-sul, ponha o joelho na barriga e deite para trás com o braço.',en:'If he wraps your neck, thread your hand under his arm and grab your own collar; move to north-south, put a knee on his belly and fall back with the arm.'},t:{pt:'Use o joelho para escorar as costas dele.',en:'Use your knee to brace his back.'}},
    {lv:'a',g:1,n:{pt:'Estrangulamento atravessado',en:'Side control collar choke'},d:{pt:'Prenda um braço com a gola e ameace o norte-sul. Quando ele tirar o braço, volte, prenda o outro braço e estrangule com a gola, polegar para dentro.',en:'Trap one arm with the collar and threaten north-south. When he pulls the arm out, come back, trap the other arm and choke with the collar, thumb in.'},t:{pt:'O começo é igual ao do armlock: a reação dele decide o ataque.',en:'It starts like the armbar: his reaction decides the attack.'}},
    {lv:'a',g:1,n:{pt:'Guilhotina',en:'Guillotine'},d:{pt:'Quando ele levanta a cabeça, envolva o pescoço, passe a gola para a outra mão, vire sobre o ombro e curve para trás empurrando o quadril.',en:'When he lifts his head, wrap the neck, pass the collar to the other hand, turn onto your shoulder and arch back, pushing your hips.'},t:{pt:'Gola bem funda, sem folga; a força vem do peso relaxado.',en:'Grip the collar deep with no slack; the power comes from relaxed weight.'}},
    {lv:'a',mine:1,n:{pt:'Armlock duplo',en:'Double armbar'},d:{pt:'Controle os dois braços e finalize o que ele defender pior.',en:'Trap both arms and finish the one he defends worse.'},t:{pt:'Sai do side control 2.',en:'Comes from side control 2.'}}
   ]},
   {name:{pt:'Montada',en:'Mount'},goal:{pt:'Manter a montada contra as fugas dele.',en:'Keep the mount against his escapes.'},items:[
    {lv:'b',n:{pt:'Montada',en:'Mount'},d:{pt:'Joelhos colados nas axilas, quadril pesado, mãos em base.',en:'Knees tight to the armpits, heavy hips, hands posted.'},t:{pt:'Joelhos abertos, quadril para a frente e calcanhares enganchados sob ele.',en:'Knees wide, hips forward and heels hooked under him.'}},
    {lv:'b',mine:1,n:{pt:'Montada alta',en:'High mount'},d:{pt:'Suba os joelhos para as axilas dele; os braços dele saem do chão e abrem o armlock.',en:'Walk your knees up to his armpits; his arms come off the mat and open the armbar.'},t:{pt:'Suba quando ele empurrar seu peito.',en:'Climb when he pushes your chest.'}},
    {lv:'b',g:1,n:{pt:'Contra empurrão no peito',en:'Vs. push on the chest'},d:{pt:'Vire de lado, passe uma mão entre os braços dele e plante no chão; repita com a outra, como se nadasse, até tirar as mãos dele do seu peito.',en:'Turn sideways, slip one hand between his arms and post it on the mat; repeat with the other, like swimming, until his hands come off your chest.'},t:{pt:'Quanto mais relaxado, mais pesado você fica.',en:'The more relaxed you are, the heavier you feel.'}},
    {lv:'b',g:1,n:{pt:'Contra empurrão na barriga',en:'Vs. push on the belly'},d:{pt:'Projete a barriga para a frente e desvie o pulso dele para o lado; repita do outro lado e deixe o peso cair sobre ele.',en:'Push your belly forward and knock his wrist to the side; repeat on the other side and let your weight fall onto him.'},t:{pt:'Joelhos abertos, quadril para a frente, calcanhares enganchados.',en:'Knees wide, hips forward, heels hooked.'}},
    {lv:'b',g:1,n:{pt:'Contra empurrão no joelho',en:'Vs. push on the knee'},d:{pt:'Enganche o pulso dele e puxe para cima, escorregando o joelho para a frente.',en:'Hook his wrist and pull it up, sliding your knee forward.'},t:{pt:'Repita do outro lado se precisar.',en:'Repeat on the other side if needed.'}},
    {lv:'b',g:1,n:{pt:'Contra levantada',en:'Vs. sitting up'},d:{pt:'Quando ele tenta levantar, segure o braço de apoio dele, puxe para trás e empurre o peito contra o rosto dele.',en:'When he tries to sit up, grab his posting arm, pull it back and press your chest into his face.'},t:{pt:'Peso relaxado funciona melhor que força.',en:'Relaxed weight works better than strength.'}}
   ]},
   {name:{pt:'Finalizar da montada',en:'Submit from mount'},goal:{pt:'Posição antes de finalização.',en:'Position before submission.'},items:[
    {lv:'b',mine:1,g:1,n:{pt:'Armlock da montada',en:'Armbar from mount'},d:{pt:'Quando ele empurra ou pega sua gola, coloque as mãos no peito dele, passe a perna sobre a cabeça e caia para trás apertando os joelhos.',en:'When he pushes or grabs your collar, put your hands on his chest, swing your leg over his head and fall back with knees tight.'},
     s:[['Mãos no peito dele, uma por dentro e outra por fora dos braços.','Hands on his chest, one inside and one outside his arms.'],['Apoie todo o peso no peito dele e suba o quadril.','Put all your weight on his chest and lift your hips.'],['Passe a perna sobre a cabeça dele.','Swing your leg over his head.'],['Caia para trás segurando o braço, aperte os joelhos e levante o quadril.','Fall back holding the arm, squeeze your knees and lift your hips.']],
     t:{pt:'Mantenha o peso no peito dele até a perna passar. Na montada alta fica mais fácil.',en:'Keep your weight on his chest until the leg is over. High mount makes it easier.'}},
    {lv:'a',g:1,n:{pt:'Armlock quando empurrado',en:'Armbar when pushed off'},d:{pt:'Se ele te empurra para o lado, segure o pulso dele enquanto cai, levante a perna sobre a cabeça e finalize.',en:'If he pushes you to the side, hold his wrist as you fall, swing your leg over his head and finish.'},t:{pt:'Escore o cotovelo no chão e encaixe a perna firme no pescoço.',en:'Brace your elbow on the mat and set the leg firmly against his neck.'}},
    {lv:'a',g:1,n:{pt:'Armlock com ele de lado',en:'Armbar when he turns'},d:{pt:'Quando ele vira de lado, prenda o braço, escorregue o joelho para trás da cabeça dele, apoie a mão na cabeça e gire a perna por cima.',en:'When he turns sideways, trap the arm, slide your knee behind his head, post your hand on his head and swing your leg over.'},t:{pt:'Todo o peso sobre a cabeça dele.',en:'All your weight on his head.'}},
    {lv:'b',g:1,n:{pt:'Estrangulamento cruzado',en:'Cross collar choke'},d:{pt:'Duas mãos fundas na gola, cruzadas atrás do pescoço; deite o peso e leve ombros e cotovelos para trás.',en:'Both hands deep in the collar, crossed behind the neck; drop your weight and pull your shoulders and elbows back.'},
     s:[['Abra a gola e entre a primeira mão até o fundo, palma para fora.','Open the collar and slide the first hand all the way in, palm out.'],['A segunda mão entra por baixo, também funda, do outro lado.','The second hand goes under, just as deep, on the other side.'],['Deite o peso, gire os punhos e abra o peito, levando ombros e cotovelos para trás.','Drop your weight, turn your wrists and open your chest, pulling shoulders and elbows back.']],
     t:{pt:'Mão relaxada desliza melhor na gola.',en:'A relaxed hand slides deeper into the collar.'}},
    {lv:'b',g:1,n:{pt:'Polegar para dentro',en:'Thumb-in choke'},d:{pt:'Polegar dentro da gola, feche o punho e leve o cotovelo ao chão, puxando a outra gola para tirar a folga.',en:'Thumb inside the collar, make a fist and drive your elbow to the mat while pulling the other lapel to remove slack.'},t:{pt:'O movimento do cotovelo é igual ao de uma guilhotina.',en:'The elbow motion is the same as a guillotine.'}},
    {lv:'a',g:1,n:{pt:'Amassa pão',en:'Bread cutter choke'},d:{pt:'Passe um lado da gola sobre a garganta, puxe o outro para ajustar e pressione com o peso, pulso reto.',en:'Lay one side of the collar across his throat, pull the other to tighten and press with your weight, wrist straight.'},t:{pt:'Também funciona de dentro da guarda.',en:'Also works from inside the guard.'}},
    {lv:'a',g:1,n:{pt:'Quebra-nozes',en:'Knuckle choke'},d:{pt:'Cotovelos no chão, duas mãos na gola atrás do pescoço, polegares para fora; puxe e role os nós dos dedos no pescoço.',en:'Elbows on the mat, both hands in the collar behind his neck, thumbs out; pull and roll your knuckles into his neck.'},t:{pt:'Pés enganchados sob as pernas dele para manter a base.',en:'Hook your feet under his legs to keep your base.'}},
    {lv:'a',g:1,n:{pt:'Estrangulamento com ele de lado',en:'Choke when he turns'},d:{pt:'Quando ele vira de lado, plante um pé, escorregue o joelho para a cabeça dele, passe a gola para a mão de baixo e puxe a outra gola.',en:'When he turns sideways, post a foot, slide your knee toward his head, pass the collar to your bottom hand and pull the other lapel.'},t:{pt:'Relaxe o peso e ache uma base confortável.',en:'Relax your weight and find a comfortable base.'}},
    {lv:'a',n:{pt:'Katagatame',en:'Arm triangle'},d:{pt:'Cabeça e braço dele presos, desça para o lado e aperte.',en:'Trap his head and arm, drop to the side and squeeze.'},t:{pt:'Saia da montada para o lado oposto ao braço.',en:'Step off mount to the side away from the arm.'}}
   ]},
   {name:{pt:'Costas',en:'Back'},goal:{pt:'Ganchos e mata-leão.',en:'Hooks and rear naked choke.'},items:[
    {lv:'a',n:{pt:'Pegar as costas',en:'Take the back'},d:{pt:'Quando ele vira de barriga para fugir, cole o peito nas costas dele e controle o tronco.',en:'When he turns face-down to escape, stick your chest to his back and control his torso.'},t:{pt:'Não tenha pressa: controle primeiro.',en:'No rush: control first.'}},
    {lv:'b',g:1,n:{pt:'Colocação dos ganchos',en:'Inserting the hooks'},d:{pt:'Com ele de barriga e você nas costas: quando ele levantar, equilibre-se nas mãos, empurre o quadril para baixo e coloque os dois ganchos ao mesmo tempo.',en:'With him face-down and you on his back: when he rises, balance on your hands, sink your hips and insert both hooks at once.'},t:{pt:'Antecipe a levantada dele.',en:'Anticipate him getting up.'}},
    {lv:'b',g:1,n:{pt:'Mata-leão',en:'Rear naked choke'},d:{pt:'Braço em volta do pescoço com a dobra do cotovelo sob o queixo; a pressão vem dos ombros, não dos braços.',en:'Arm around the neck with the crook of the elbow under his chin; the pressure comes from your shoulders, not your arms.'},
     s:[['Dobra do cotovelo alinhada sob o queixo dele.','Crook of your elbow lined up under his chin.'],['Mão no seu próprio bíceps.','Hand on your own biceps.'],['Outra mão atrás da cabeça dele, como se penteasse o cabelo.','Other hand behind his head, as if combing his hair.'],['Abaixe a cabeça, abra o peito e leve ombros e cotovelos para trás.','Lower your head, open your chest and pull shoulders and elbows back.']],
     t:{pt:'Um abraço relaxado: braços duros tiram o aperto.',en:'A relaxed hug: stiff arms take away the squeeze.'}}
   ]}
  ],
  games:[
   {n:{pt:'Guardião da postura',en:'Posture keeper'},d:{pt:'Começa na guarda fechada. Treina postura, bíceps e mão oposta.',en:'Starts in closed guard. Trains posture, biceps grips and the opposite hand.'},who:{pt:'Baixo tenta quebrar a postura ou alcançar o pescoço',en:'Bottom tries to break posture or reach the neck'},win:{pt:'Cima: 30 s de postura com as duas mãos dele controladas',en:'Top: 30 s of posture with both his hands controlled'},time:'30 s × 6'},
   {n:{pt:'Abrir e passar',en:'Open and pass'},d:{pt:'Começa na guarda fechada. Treina a passagem em pé ou ajoelhado.',en:'Starts in closed guard. Trains the standing or kneeling pass.'},who:{pt:'Cima tenta passar',en:'Top tries to pass'},win:{pt:'Cima: side control por 3 s. Baixo: raspar, finalizar ou fechar a guarda 2 vezes',en:'Top: side control for 3 s. Bottom: sweep, submit or re-close guard twice'},time:'2 min'},
   {n:{pt:'Ciclo 1 a 5',en:'Cycle 1 to 5'},mine:1,d:{pt:'Começa no side control 1. Treina transições sem perder pressão.',en:'Starts in side control 1. Trains transitions without losing pressure.'},who:{pt:'Cima circula 1→5→2',en:'Top cycles 1→5→2'},win:{pt:'Cima: completar o ciclo. Baixo (50%): repor a guarda',en:'Top: complete the cycle. Bottom (50%): recover guard'},time:'1 min'},
   {n:{pt:'Estabilize a montada',en:'Hold the mount'},d:{pt:'Começa montado. O de baixo usa os 4 empurrões do livro: peito, barriga, joelho e levantada.',en:'Starts in mount. The bottom player uses the book\'s 4 escapes: chest push, belly push, knee push and sitting up.'},who:{pt:'Baixo tenta sair',en:'Bottom tries to escape'},win:{pt:'Cima: 30 s na montada. Baixo: chegar à guarda',en:'Top: 30 s in mount. Bottom: reach guard'},time:'30 s × 4'},
   {n:{pt:'Xadrez BJJ',en:'BJJ chess'},mine:1,d:{pt:'Cada jogador tem 3 movimentos, um por vez e em câmera lenta, para melhorar a posição e finalizar.',en:'Each player gets 3 moves, one at a time and in slow motion, to improve position and submit.'},who:{pt:'Os dois, alternando',en:'Both, taking turns'},win:{pt:'Finalizar ou terminar na melhor posição',en:'Submit or finish in the better position'},time:{pt:'3 movimentos cada',en:'3 moves each'}}
  ]
 },
 bottom:{
  title:{pt:'Guarda por baixo',en:'Bottom guard'},
  intro:{pt:'Quem está por baixo, seguindo o livro Gracie Jiu-Jitsu: a guarda fechada, as raspagens e finalizações clássicas e as saídas da montada, do side control e das costas. As outras guardas vêm como complemento.',en:'The bottom player, following the Gracie Jiu-Jitsu book: closed guard, the classic sweeps and submissions, and escapes from mount, side control and the back. The other guards come as a complement.'},
  seq:false,
  stages:[
   {name:{pt:'Guarda fechada',en:'Closed guard'},goal:{pt:'Manter ele na mira, pegar as mangas e quebrar a postura.',en:'Keep him in your sights, grab the sleeves and break posture.'},items:[
    {lv:'b',mine:1,n:{pt:'Conceito da mira',en:'The "sights" concept'},d:{pt:'Mantenha o oponente sempre dentro da guarda, no meio da mira, não importa para onde você se mova. Pernas são a mira grande (calibre .50): mais poder e mais oportunidades de atacar braço ou pescoço, raspar, empurrar e puxar. Mãos são a mira pequena (calibre .22): use quando perder a mira das pernas, apontando para o que dá para manipular (pescoço, cabeça, ombro, cotovelo, mão).',en:'Always keep your opponent inside your guard, centered in your sights, wherever you move. Legs are the big sights (.50 caliber): more power and more chances to attack an arm or the neck, sweep, push and pull. Hands are the small sights (.22 caliber): use them when you lose the legs, aiming at what you can manipulate (neck, head, shoulder, elbow, hand).'},t:{pt:'Dá para vencer só com as mãos, mas dá muito mais trabalho.',en:'You can win with hands alone, but it takes much more work.'}},
    {lv:'b',mine:1,n:{pt:'Pegadas nas mangas',en:'Sleeve grips'},d:{pt:'Pegue nas duas mangas ao mesmo tempo e traga braços e mãos dele para perto do seu peito. Use o joelho junto com as mãos para quebrar a postura e trazê-lo para perto.',en:'Grab both sleeves at the same time and bring his arms and hands close to your chest. Use your knee together with your hands to break his posture and pull him in.'},t:{pt:'Tire as pegadas dele antes de pegar as suas: quem tem o controle interno dita a luta.',en:'Strip his grips before you take yours: whoever has inside control runs the fight.'}},
    {lv:'b',g:1,n:{pt:'Posição clássica',en:'Classic position'},d:{pt:'Pernas cruzadas nas costas dele, uma mão na gola e a outra no cotovelo. É o ponto de partida das raspagens e finalizações do livro.',en:'Legs crossed behind his back, one hand on the collar and the other on the elbow. It starts all of the book\'s sweeps and submissions.'},t:{pt:'Controlar o cotovelo atrapalha a passagem dele.',en:'Controlling his elbow disrupts his pass.'}},
    {lv:'b',n:{pt:'Quebrar a postura',en:'Break posture'},d:{pt:'Puxe com as pernas e com as pegadas na gola para trazer ele para baixo.',en:'Pull with your legs and collar grips to bring him down.'},t:{pt:'Joelhos para o peito, não só os braços.',en:'Knees to chest, not just arms.'}},
    {lv:'b',n:{pt:'Ângulo de quadril',en:'Hip angle'},d:{pt:'Saia do centro girando o quadril para abrir os ataques.',en:'Move off center by turning your hips to open attacks.'},t:{pt:'Quadril parado no chão = guarda morta.',en:'Flat hips = dead guard.'}},
    {lv:'b',n:{pt:'Guarda alta',en:'High guard'},d:{pt:'Suba as pernas fechadas para perto das axilas dele, mantendo a postura dele quebrada.',en:'Climb your locked legs up near his armpits, keeping his posture broken.'},t:{pt:'Quebre a postura com as mãos antes de subir as pernas.',en:'Break posture with your hands before climbing your legs.'}}
   ]},
   {name:{pt:'Raspagens clássicas',en:'Classic sweeps'},goal:{pt:'Inverter e terminar montado.',en:'Reverse and end up in mount.'},items:[
    {lv:'b',mine:1,n:{pt:'Raspagem windmill (moinho)',en:'Windmill sweep'},d:{pt:'Raspagem da sua aula: abra as pernas e raspe com um movimento de moinho de vento. Existe também uma versão com pegada na lapela.',en:'Sweep from your class: open your legs and sweep with a windmill motion. There is also a version with a lapel grip.'},t:{pt:'Pendente: anotar qual perna e qual mão fazem o quê e em qual pegada começa.',en:'To do: note which leg and hand do what and which grip it starts from.'}},
    {lv:'b',g:1,n:{pt:'Prendendo os calcanhares',en:'Heel trap sweep'},d:{pt:'Quando ele levanta dentro da guarda, controle os cotovelos, segure os calcanhares dele e empurre os joelhos contra a cintura dele até sentar na montada.',en:'When he stands in your guard, control his elbows, grab his heels and drive your knees into his waist until you sit up into mount.'},s:[['Ele se levanta dentro da guarda: controle os dois cotovelos.','He stands in your guard: control both elbows.'],['De repente, segure os calcanhares dele e abaixe o quadril.','Suddenly grab his heels and drop your hips.'],['Levante o quadril na hora, empurrando os joelhos contra a cintura dele.','Lift your hips right away, driving your knees into his waist.'],['Sente para a frente e chegue à montada.','Sit forward and come up into mount.']],
     t:{pt:'Prenda os calcanhares no mesmo instante em que empurra. Empurre com os joelhos, não com as panturrilhas.',en:'Grab the heels the instant you push. Push with your knees, not your calves.'}},
    {lv:'b',g:1,n:{pt:'Jogando para cima',en:'Overhead sweep'},d:{pt:'Quando ele levanta, abra a guarda, coloque os pés no quadril dele e controle os cotovelos; estique as pernas e deixe o peso dele levar você para a montada.',en:'When he stands, open your guard, put your feet on his hips and control his elbows; extend your legs and let his weight carry you into mount.'},s:[['Ele levanta para passar: descruze as pernas e ponha os pés no quadril dele.','He stands to pass: uncross your legs and put your feet on his hips.'],['Controle os cotovelos dele.','Control his elbows.'],['Estique as pernas e jogue-o para cima, com os pés junto à cintura dele.','Extend your legs and lift him overhead, feet at his waist.'],['Use o peso dele para ser levado junto e caia na montada.','Let his weight carry you along and land in mount.']],
     t:{pt:'Quadril no chão (levantado é erro) e sua cabeça fora da frente.',en:'Hips on the mat (lifted is a mistake) and your head out of the way.'}},
    {lv:'b',g:1,n:{pt:'Tesoura lateral',en:'Scissor sweep'},d:{pt:'Quando ele levanta uma perna, abra a guarda, apoie a panturrilha na coxa dele, tire o quadril do chão, vire de lado e faça a tesoura.',en:'When he raises a leg, open your guard, rest your calf on his thigh, lift your hips, turn sideways and scissor.'},
     s:[['Perna dele levantada: descruze os pés.','His leg is up: uncross your feet.'],['Peso no ombro e na panturrilha sobre a coxa dele; levante o quadril.','Weight on your shoulder and your calf on his thigh; lift your hips.'],['Use a gola como apoio, gire de lado e recue o quadril ao máximo.','Use the collar as an anchor, turn sideways and shift your hips back as far as you can.'],['Tesoura: perna de baixo para trás, perna de cima para a frente, até montar.','Scissor: bottom leg back, top leg forward, until you mount.']],
     t:{pt:'Balance o quadril como uma rede.',en:'Swing your hips like a hammock.'}},
    {lv:'b',mine:1,g:1,n:{pt:'Raspagem com gancho',en:'Hook sweep'},d:{pt:'Quando ele tenta entrar com a mão na dobra do seu joelho, descruze os pés, recue o quadril, enganche um pé sob o joelho dele e eleve a perna puxando o cotovelo.',en:'When he reaches into the back of your knee, uncross your feet, shift your hips back, hook a foot under his knee and lift the leg while pulling his elbow.'},s:[['Ele segura seu bíceps: agarre o kimono atrás do cotovelo dele.','He grips your biceps: grab the gi behind his elbow.'],['Ele levanta uma perna e enfia a mão na dobra do seu joelho: descruze os pés.','He raises a leg and reaches into the back of your knee: uncross your feet.'],['Panturrilha na coxa dele, peso no ombro oposto e quadril para trás.','Calf on his thigh, weight on the opposite shoulder, hips back.'],['Enganche um pé sob o joelho dele e ponha o outro pé no outro joelho.','Hook one foot under his knee and put the other foot on his other knee.'],['Empurre o joelho de baixo, puxe o cotovelo e eleve a perna com o gancho até montar.','Push the bottom knee, pull the elbow and lift with the hook until you mount.']],
     t:{pt:'Tire o quadril do chão para recuar com mais facilidade.',en:'Lift your hips off the mat to shift back more easily.'}},
    {lv:'b',g:1,n:{pt:'Sentando e empurrando',en:'Sit-up sweep'},d:{pt:'Quando ele senta para trás, abra a guarda, apoie-se no cotovelo, prenda o braço dele e empurre com a barriga até ele rolar.',en:'When he sits back, open your guard, come up on your elbow, trap his arm and drive with your belly until he rolls over.'},s:[['Mão na gola e no cotovelo dele.','Hand on his collar and on his elbow.'],['Ele senta para trás: descruze as pernas e desça a mão da gola para trás do cotovelo dele.','He sits back: uncross your legs and slide the collar hand down behind his elbow.'],['Levante apoiado no próprio cotovelo, depois com o braço esticado.','Come up on your elbow, then onto your straight arm.'],['Apoie-se no pé do lado oposto, prenda o cotovelo dele e empurre com a barriga até ele rolar para trás.','Post on the opposite foot, trap his elbow and drive with your belly until he rolls back.']],
     t:{pt:'Pé de apoio esticado durante a rolagem.',en:'Keep your base foot extended as you roll him.'}}
   ]},
   {name:{pt:'Raspagens complementares',en:'Complementary sweeps'},goal:{pt:'Opções modernas de outras guardas.',en:'Modern options from other guards.'},items:[
    {lv:'b',n:{pt:'Pêndulo',en:'Flower sweep'},d:{pt:'Prenda um braço, balance a perna como um pêndulo e role ele por cima.',en:'Trap an arm, swing your leg like a pendulum and roll him over.'},t:{pt:'Combina com o armlock.',en:'Pairs with the armbar.'}},
    {lv:'b',n:{pt:'Raspagem de borboleta',en:'Butterfly sweep'},d:{pt:'Da borboleta: underhook, tombe de lado e levante com o gancho.',en:'From butterfly: underhook, fall to the side and lift with the hook.'},t:{pt:'Prenda o braço do lado da queda.',en:'Trap the arm on the falling side.'}},
    {lv:'b',n:{pt:'Velha guarda',en:'Old school sweep'},d:{pt:'Da meia-guarda: underhook, segure o tornozelo e suba.',en:'From half guard: underhook, grab the ankle and come up.'},t:{pt:'Cabeça na axila dele.',en:'Head in his armpit.'}},
    {lv:'a',n:{pt:'Berimbolo',en:'Berimbolo'},d:{pt:'Da De La Riva, gire por baixo para pegar as costas.',en:'From De La Riva, invert underneath to take the back.'},t:{pt:'Exige mobilidade e treino lento.',en:'Needs mobility and slow drilling.'}},
    {lv:'a',n:{pt:'Raspagem da X',en:'X-guard sweep'},d:{pt:'Estique as pernas e tire a base dele.',en:'Extend your legs and take away his base.'},t:{pt:'Levante junto quando ele cair.',en:'Come up as he falls.'}}
   ]},
   {name:{pt:'Finalizações da guarda',en:'Submissions from guard'},goal:{pt:'Atacar quando ele tenta passar ou expõe um braço.',en:'Attack when he tries to pass or exposes an arm.'},items:[
    {lv:'b',mine:1,n:{pt:'Armlock com giro de quadril',en:'Armbar with hip pivot'},d:{pt:'O armlock da sua aula: a perna trava o cotovelo pisando no quadril dele e o seu quadril gira como um eixo embaixo dele para mudar os ângulos a seu favor.',en:'The armbar from your class: your leg locks his elbow by stepping on his hip, and your hips pivot like an axle underneath him to change the angles in your favor.'},
     s:[['Escolha um braço (ex.: o direito dele) e controle pulso e tríceps.','Pick an arm (e.g. his right) and control the wrist and triceps.'],['A perna esquerda trava o cotovelo, pisando no quadril dele.','Your left leg locks the elbow by stepping on his hip.'],['Solte a manga e abrace o antebraço dele: segure o próprio kimono ou faça um abraço forte.','Release the sleeve and hug his forearm: grab your own gi or squeeze tight.'],['Gire o quadril como eixo embaixo dele até ficar perpendicular. Não é fuga de quadril: é troca de ângulo.','Pivot your hips like an axle underneath him until you are perpendicular. It is not a hip escape: it is an angle change.'],['Passe a perna sobre a cabeça, segure o pulso e finalize com pressão do quadril.','Swing your leg over the head, hold the wrist and finish with hip pressure.']],
     t:{pt:'Treine o giro de 90° isolado: é a parte mais difícil. Daqui também saem triângulo, kimura e raspagens.',en:'Drill the 90° pivot on its own: it is the hardest part. Triangle, kimura and sweeps also come from here.'}},
    {lv:'b',g:1,n:{pt:'Armlock (perna sobre a cabeça)',en:'Armbar (leg over the head)'},d:{pt:'Quando ele ajoelha para entrar com o ombro sob seu joelho, plante o pé, recue o quadril, passe a perna sobre a cabeça dele e estenda o braço.',en:'When he kneels to get his shoulder under your knee, post your foot, shift your hips back, swing your leg over his head and extend the arm.'},
     s:[['Mão na gola e no cotovelo dele.','Hand on his collar and on his elbow.'],['Ele entra para passar: plante o pé no chão e recue o quadril.','He moves to pass: post your foot and shift your hips back.'],['Recue o tronco e passe a perna por cima da cabeça dele.','Lean your torso back and swing your leg over his head.'],['Prenda o pulso e pressione o cotovelo para baixo com a perna, levantando o pulso.','Trap the wrist and press the elbow down with your leg as you lift the wrist.']],
     t:{pt:'Recuar o tronco abre espaço para a perna passar.',en:'Leaning back makes room for the leg to pass.'}},
    {lv:'b',g:1,n:{pt:'Omoplata',en:'Omoplata'},d:{pt:'Plante o pé, recue o quadril, passe a perna por cima prendendo a cabeça e enrole o braço; sente, abrace a cintura dele e levante o quadril para a frente.',en:'Post your foot, shift your hips back, swing your leg over trapping the head and wrap the arm; sit up, hug his waist and push your hips forward.'},s:[['Mão na gola e no cotovelo dele.','Hand on his collar and on his elbow.'],['Ele levanta uma perna: plante o pé no chão e recue o quadril.','He raises a leg: post your foot and shift your hips back.'],['Recue o tronco e passe a perna por cima, prendendo a cabeça e enrolando o braço.','Lean back and swing your leg over, trapping his head and wrapping the arm.'],['Sente, segure a cintura dele e reposicione as pernas.','Sit up, hold his waist and reposition your legs.'],['Levante o quadril para a frente para finalizar.','Push your hips forward to finish.']],
     t:{pt:'Abrace a cintura para ele não rolar para a frente.',en:'Hug his waist so he can\'t roll forward.'}},
    {lv:'b',mine:1,g:1,n:{pt:'Kimura da guarda',en:'Kimura from guard'},d:{pt:'Quando ele põe a mão no chão, segure o pulso, sente apoiado no cotovelo, passe o braço por trás e segure o próprio pulso; role para trás e torça com o braço a 90 graus.',en:'When he posts a hand, grab the wrist, sit up on your elbow, reach over his arm and grab your own wrist; fall back and rotate with the arm at 90 degrees.'},s:[['Ele põe a mão no chão: segure o pulso.','He posts a hand: grab the wrist.'],['Descruze as pernas e sente apoiado no cotovelo, passando o braço por trás.','Uncross your legs and sit up on your elbow, reaching over his arm.'],['Segure o próprio pulso e role para trás, prendendo a perna dele.','Grab your own wrist and fall back, trapping his leg.'],['Recue o quadril até sair de baixo dele, braço dele dobrado a 90 graus.','Shift your hips until you are out from under him, his arm bent at 90 degrees.'],['Perna sobre as costas dele, braço contra o seu peito; gire o pulso como um limpador de para-brisa.','Leg over his back, arm against your chest; turn the wrist like a windshield wiper.']],
     t:{pt:'Ao sentar, recue o quadril e não caia sobre o próprio braço.',en:'As you sit up, shift your hips back and don\'t fall on your own arm.'}},
    {lv:'b',mine:1,g:1,n:{pt:'Triângulo',en:'Triangle'},d:{pt:'Quando ele entra com um braço por dentro da sua perna, puxe esse braço, gire o quadril e trave a perna no pescoço dele.',en:'When he puts one arm inside your leg, pull that arm, turn your hips and lock your leg around his neck.'},
     s:[['Segure o pulso e o cotovelo do braço que entrou.','Grab the wrist and elbow of the arm that came in.'],['Plante o pé, gire o quadril e puxe o braço para você.','Post your foot, turn your hips and pull the arm toward you.'],['Encaixe a dobra do joelho no pescoço e passe o braço dele para o outro lado.','Fit the back of your knee around his neck and pull his arm across.'],['Trave a perna livre sobre o tornozelo, puxe a cabeça e levante o quadril.','Lock your free leg over your ankle, pull his head and lift your hips.']],
     t:{pt:'Fique perpendicular a ele. Um braço dentro e outro fora das suas pernas; para apertar, puxe a cabeça, aperte os joelhos e aproxime o quadril. Se ele resistir, a kimura vira alça para raspar (hip bump).',en:'Get perpendicular to him. One arm inside and one outside your legs; to tighten, pull the head, squeeze your knees and bring your hips closer. If he resists, the kimura becomes a handle to sweep (hip bump).'}},
    {lv:'a',g:1,n:{pt:'Armlock girando',en:'Spinning armbar'},d:{pt:'Quando ele levanta uma perna, prenda o cotovelo, segure atrás da panturrilha dele, curve-se como uma tartaruga e gire para passar a perna sobre a cabeça.',en:'When he raises a leg, trap the elbow, grab behind his calf, curl up like a turtle and spin to swing your leg over his head.'},s:[['Ele levanta uma perna: prenda o cotovelo dele.','He raises a leg: trap his elbow.'],['Descruze os pés e segure atrás da panturrilha dele.','Uncross your feet and grab behind his calf.'],['Curve-se como uma tartaruga, tire pélvis e cabeça do chão e gire sobre o meio das costas.','Curl up like a turtle, lift your pelvis and head off the mat and spin on your mid-back.'],['Passe a perna por cima da cabeça, prenda o braço no peito e levante o quadril.','Swing your leg over his head, trap the arm to your chest and lift your hips.']],
     t:{pt:'Pernas soltas no giro, sem encostar nele.',en:'Keep your legs loose during the spin so you don\'t bump him.'}},
    {lv:'b',g:1,n:{pt:'Guilhotina',en:'Guillotine'},d:{pt:'Quando ele abaixa a cabeça, envolva o pescoço com a lâmina do antebraço na garganta e segure o pulso desse braço com a outra mão; cruze os pés, puxe o braço e estique as pernas.',en:'When he drops his head, wrap the neck with your forearm blade across the throat and grab that wrist with your other hand; cross your feet, pull the arm and extend your legs.'},t:{pt:'Queixo dele preso na dobra do seu braço.',en:'Keep his chin trapped in the crook of your arm.'}},
    {lv:'a',g:1,n:{pt:'Amassa pão da guarda',en:'Bread cutter from guard'},d:{pt:'Solte a gola dele com a palma para baixo e sem o polegar, passe um lado sobre a garganta, puxe o outro para ajustar e pressione com o pulso reto.',en:'Free his lapel palm-down without the thumb, lay one side across his throat, pull the other side to tighten and press with a straight wrist.'},t:{pt:'O nó do dedo mínimo pressiona a carótida.',en:'The knuckle of your little finger presses the carotid.'}},
    {lv:'b',n:{pt:'Estrangulamento cruzado',en:'Cross collar choke'},d:{pt:'Duas mãos fundas na gola, puxe e abra os cotovelos.',en:'Both hands deep in the collar, pull and flare the elbows.'},t:{pt:'A primeira mão bem funda.',en:'Get the first hand very deep.'}}
   ]},
   {name:{pt:'Chaves de pé',en:'Foot locks'},goal:{pt:'Atacar o pé exposto, com cuidado.',en:'Attack an exposed foot, carefully.'},items:[
    {lv:'b',g:1,n:{pt:'Chave de pé de frente',en:'Straight ankle lock'},d:{pt:'Com a perna dele entre as suas, prenda o tornozelo sob a axila e o antebraço sob o tendão de Aquiles; segure o próprio pulso e curve para trás.',en:'With his leg between yours, trap the ankle under your armpit and your forearm under his Achilles tendon; grab your own wrist and arch back.'},t:{pt:'Pé dele bem ajustado; use a perna para mantê-lo à distância.',en:'Keep his foot snug; use your leg to keep him at a distance.'}},
    {lv:'a',g:1,n:{pt:'Chave de calcanhar',en:'Heel hook'},d:{pt:'Prenda os dedos do pé dele sob a axila, gire a perna, coloque o antebraço sob o calcanhar e gire contra o seu corpo.',en:'Trap his toes under your armpit, rotate the leg, put your forearm under the heel and turn it against your body.'},t:{pt:'Muito perigosa: lesiona o joelho antes de doer. Só com supervisão e conforme as regras da faixa.',en:'Very dangerous: it injures the knee before it hurts. Only with supervision and per belt rules.'}},
    {lv:'a',g:1,n:{pt:'Chave de dedos',en:'Toe hold'},d:{pt:'Segure a base dos dedos do pé dele, passe a outra mão por baixo do calcanhar, segure o próprio pulso e torça o tornozelo.',en:'Grip the base of his toes, thread your other hand under the heel, grab your own wrist and twist the ankle.'},t:{pt:'Funciona de várias posições.',en:'Works from many positions.'}}
   ]},
   {name:{pt:'Sair da montada',en:'Escape the mount'},goal:{pt:'Voltar para a guarda ou ficar por cima.',en:'Get back to guard or end up on top.'},items:[
    {lv:'b',g:1,n:{pt:'Upa (saída de barrigada)',en:'Upa (bridge and roll)'},d:{pt:'Prenda o pulso, o cotovelo e o pé do mesmo lado; levante o quadril o mais alto possível, role sobre o ombro e caia de joelhos.',en:'Trap the wrist, elbow and foot on the same side; bridge as high as you can, roll over your shoulder and land on your knees.'},
     s:[['Cotovelos colados ao corpo, escorando os joelhos dele.','Elbows tight to your body, blocking his knees.'],['Prenda o pulso (sem polegar), o cotovelo e o pé do mesmo lado.','Trap the wrist (no thumb), the elbow and the foot on the same side.'],['Faça a ponte apoiado nas costas, não na cabeça.','Bridge off your upper back, not your head.'],['Role sobre o ombro e caia de joelhos, não de barriga.','Roll over your shoulder and land on your knees, not your belly.']],
     t:{pt:'Mantenha o braço dele preso durante toda a rolagem.',en:'Keep his arm trapped through the whole roll.'}},
    {lv:'b',g:1,n:{pt:'Saída de cotovelo',en:'Elbow escape'},d:{pt:'Quando ele abre a perna para segurar a upa, escore o joelho dele, vire de lado, recue o quadril e tire uma perna de cada vez até fechar a guarda.',en:'When he widens a leg to stop the upa, block his knee, turn sideways, shift your hips back and free one leg at a time until you close your guard.'},s:[['Prenda o pulso, o cotovelo e o pé do mesmo lado, e comece a upa.','Trap the wrist, elbow and same-side foot, and start the upa.'],['Ele abre a perna para segurar a base: escore o joelho dele com as duas mãos e vire a sua perna de lado no chão.','He widens a leg to base: block his knee with both hands and turn your leg sideways on the mat.'],['Peso no ombro e no pé oposto, vire de lado e recue o quadril; encolha o joelho e plante o pé.','Weight on your shoulder and opposite foot, turn sideways and shift your hips back; pull your knee in and post your foot.'],['Recue o quadril para o outro lado, solte a perna e prenda a dele.','Shift your hips the other way, free your leg and trap his.'],['Repita do outro lado e cruze as pernas: ele está na sua guarda.','Repeat on the other side and cross your legs: he is in your guard.']],
     t:{pt:'Peso no pé e no ombro oposto para mover o quadril.',en:'Weight on your foot and opposite shoulder to move your hips.'}},
    {lv:'b',g:1,n:{pt:'Exercício de saída de cotovelo',en:'Elbow escape drill'},d:{pt:'Sozinho ou com parceiro: escore os joelhos com os cotovelos, vire de lado, recue o quadril, encolha o joelho, plante o pé e repita para o outro lado.',en:'Solo or with a partner: block the knees with your elbows, turn sideways, shift your hips, pull your knee in, post your foot and repeat to the other side.'},t:{pt:'Levante o quadril e balance como uma rede.',en:'Lift your hips and swing them like a hammock.'}},
    {lv:'a',g:1,n:{pt:'Saída por trás',en:'Back door escape'},d:{pt:'Dê a ponte para jogar ele para a frente, segure o kimono sob as axilas, encaixe os pés sob as axilas dele e empurre até sair por trás.',en:'Bridge to tip him forward, grip the gi under his armpits, slide your feet under his armpits and push until you come out the back.'},s:[['Dê a ponte para jogá-lo para a frente e agarre o kimono sob as axilas dele.','Bridge to tip him forward and grab the gi under his armpits.'],['Estique os braços para mantê-lo inclinado e levante os pés.','Straighten your arms to keep him leaning and lift your feet.'],['Encaixe os pés sob as axilas dele e empurre para a frente.','Set your feet under his armpits and push forward.'],['Saia por trás, estabeleça a base, sente e controle as pernas dele.','Come out the back, set your base, sit back and control his legs.']],
     t:{pt:'Ao rolar para trás, vire um pouco sobre o ombro para proteger o pescoço.',en:'As you roll back, turn slightly onto your shoulder to protect your neck.'}}
   ]},
   {name:{pt:'Sair do side control',en:'Escape side control'},goal:{pt:'Criar espaço e repor a guarda.',en:'Make space and recover guard.'},items:[
    {lv:'b',g:1,n:{pt:'Upa do side control',en:'Upa from side control'},d:{pt:'Quando ele passa a perna para montar, abrace a cintura dele e, no momento em que o pé dele toca o chão, faça uma ponte forte e role ele para a sua guarda.',en:'When he swings a leg over to mount, hug his waist and, as his foot touches the mat, bridge hard and roll him into your guard.'},t:{pt:'O tempo certo é quando o peso dele ainda está atrás.',en:'The timing is when his weight is still behind him.'}},
    {lv:'b',g:1,n:{pt:'Saída de cotovelo do side control',en:'Elbow escape from side control'},d:{pt:'Quando ele passa a perna para montar, use o cotovelo para levantar o joelho de trás dele, entre com o seu joelho por baixo, recue o quadril e feche a guarda.',en:'When he swings a leg over, use your elbow to lift his back knee, slide your knee under, shift your hips back and close your guard.'},t:{pt:'Entre com o joelho quando ele troca o peso de lado. Não tente levantar o quadril.',en:'Slide your knee in as he shifts his weight. Don\'t try to lift your hips.'}},
    {lv:'b',g:1,n:{pt:'Gravata lateral: armação do braço',en:'Side headlock: arm frame'},d:{pt:'Faça uma armação com o antebraço no pescoço dele, afaste o quadril, passe a perna sobre a cabeça dele e aperte o pescoço com as pernas.',en:'Frame your forearm across his neck, move your hips away, swing your leg over his head and squeeze his neck with your legs.'},t:{pt:'Aperte o pescoço, não a cabeça.',en:'Squeeze the neck, not the head.'}},
    {lv:'b',g:1,n:{pt:'Gravata lateral: cabeça abaixada',en:'Side headlock: head down'},d:{pt:'Se ele abaixa a cabeça na gravata, abrace o ombro dele, levante a perna, enganche o pé e suba nas costas abrindo braços e pernas; ele rola junto. Depois faça a armação no pescoço e incline o peso para a frente até ele soltar.',en:'If he drops his head in the headlock, hug his shoulder, raise your leg, hook your foot and climb onto his back with arms and legs wide; he rolls with you. Then frame across his neck and lean forward until he lets go.'},t:{pt:'Use o ombro como apoio para ajoelhar e tirar o braço de baixo.',en:'Use your shoulder as a post to get to your knees and free your bottom arm.'}},
    {lv:'a',g:1,n:{pt:'Gravata lateral: ele encolhido',en:'Side headlock: legs tucked'},d:{pt:'Se ele encolhe as pernas, vire de lado, abrace o ombro, ajoelhe apoiado no ombro e use as costas para levantá-lo e rolá-lo para trás. Se ele abrir a perna, leve-o para baixo e pule por cima das costas dele.',en:'If he tucks his legs, turn sideways, hug the shoulder, get to your knees off your shoulder and use your back to lift and roll him. If he widens a leg, bring him down and hop over his back.'},t:{pt:'Levante com as costas, não com o braço; tire a sua perna do caminho ao rolar.',en:'Lift with your back, not your arm; move your leg out of the way as you roll him.'}},
    {lv:'b',g:1,n:{pt:'Upa contra gravata na montada',en:'Upa vs. headlock in mount'},d:{pt:'Se ele está montado com uma gravata, prenda o tríceps dele e o pé do mesmo lado, escore a outra mão sob a cintura dele, prenda o braço com a cabeça e dê a ponte para rolar.',en:'If he is mounted with a headlock, trap his triceps and same-side foot, brace your other hand under his waist, pin his arm with your head and bridge to roll.'},t:{pt:'Faça a ponte apoiado nas costas, não na cabeça.',en:'Bridge off your upper back, not your head.'}},
    {lv:'a',g:1,n:{pt:'Gravata lateral: braço preso',en:'Side headlock: arm trapped'},d:{pt:'Segure o próprio pulso sob a axila dele, recue quadril e ombro para criar folga e, quando ele reajustar, dê a ponte e role ele.',en:'Grab your own wrist under his armpit, shift hips and shoulder back to make slack and, when he readjusts, bridge and roll him.'},t:{pt:'Crie folga quantas vezes for preciso até ele reajustar.',en:'Make slack as many times as needed until he readjusts.'}},
    {lv:'a',g:1,n:{pt:'Estrangulamento com a perna',en:'Leg choke from bottom'},d:{pt:'Por baixo do side control, pegue a gola de trás dele com o polegar para dentro; quando ele mover o braço para trás, passe a perna sobre a cabeça e estrangule.',en:'From bottom side control, grab his back collar thumb-in; when he moves his arm back, swing your leg over his head and choke.'},t:{pt:'Recue o quadril para convidar ele a mover o braço.',en:'Shift your hips to invite him to move his arm.'}},
    {lv:'b',n:{pt:'Fuga de quadril',en:'Hip escape (shrimp)'},d:{pt:'Pés no chão, empurre e afaste o quadril para criar espaço.',en:'Feet on the mat, push and move your hips away to make space.'},t:{pt:'O movimento mais importante do jiu-jitsu.',en:'The most important movement in jiu-jitsu.'}},
    {lv:'b',n:{pt:'Enquadrar e repor a guarda',en:'Frame and recover guard'},d:{pt:'Antebraços no pescoço e no quadril dele; com espaço, traga o joelho para dentro e os pés para o quadril dele.',en:'Forearms on his neck and hip; with space, bring your knee back in and your feet to his hips.'},t:{pt:'Empurre com estrutura, não com força.',en:'Push with structure, not strength.'}}

   {name:{pt:'Sair das costas',en:'Escape the back'},goal:{pt:'Proteger o pescoço e virar de frente.',en:'Protect your neck and turn to face him.'},items:[

function renderChrome(){
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.getElementById('appTitle').textContent = L(UI.title);
  document.getElementById('btnPt').setAttribute('aria-pressed', lang === 'pt');
  document.getElementById('btnEn').setAttribute('aria-pressed', lang === 'en');
  var nav = document.getElementById('nav'), h = '';
  ['top','bottom','lesson','method'].forEach(function(k){
    h += '<a href="#' + k + '"' + (view === k ? ' aria-current="page"' : '') + '>' + esc(L(UI.nav[k])) + '</a>';
  });
  nav.innerHTML = h;
}

function techBtn(mod, si, ii, it){
  var hide = level !== 'all' && it.lv !== level;
  return '<button type="button" class="tech ' + it.lv + '" data-m="' + mod + '" data-s="' + si + '" data-i="' + ii + '"' + (hide ? ' hidden' : '') + '>' + esc(L(it.n)) + (it.mine ? ' <span class="mine">★</span>' : '') + (it.g ? ' <span class="gtag">G</span>' : '') + '</button>';
}

function gameCard(g){
  return '<div class="card"><h4>' + esc(L(g.n)) + (g.mine ? ' <span class="mine">★ ' + esc(L(UI.mine)) + '</span>' : '') + '</h4><p>' + esc(L(g.d)) + '</p>' +
    '<div class="rule"><b>' + esc(L(UI.top)) + '</b><span>' + esc(L(g.who)) + '</span><b>' + esc(L(UI.win)) + '</b><span>' + esc(L(g.win)) + '</span><b>' + esc(L(UI.time)) + '</b><span>' + esc(L(g.time)) + '</span></div></div>';
}

function renderModule(mod){
  var M = D[mod], h = '';
  h += '<div class="intro"><div><h2>' + esc(L(M.title)) + '</h2><p>' + esc(L(M.intro)) + ' ' + esc(L(UI.tapHint)) + '</p></div><div class="filters" role="group">';
  ['all','b','a'].forEach(function(k){ h += '<button type="button" class="chipbtn" data-level="' + k + '" aria-pressed="' + (level === k) + '">' + esc(L(UI[k])) + '</button>'; });
  h += '</div></div>';
  h += '<div class="legend"><span><i class="sw b"></i>' + esc(L(UI.bBelt)) + '</span><span><i class="sw a"></i>' + esc(L(UI.aBelt)) + '</span><span><b class="mine">★</b> ' + esc(L(UI.mine)) + '</span><span><b class="gtag">G</b> ' + esc(L(UI.gTag)) + '</span></div>';
  h += '<div class="spine">';
  M.stages.forEach(function(st, si){
    h += '<section class="stage"><div class="node" aria-hidden="true">' + (M.seq ? (si + 1) : '•') + '</div><div class="stage-body"><div class="stage-head"><h3>' + esc(L(st.name)) + '</h3><span class="goal">' + esc(L(st.goal)) + '</span></div><div class="techs">';

    h += '</div></div></section>';
  });
  h += '</div><section class="games"><h3 class="sect-title">' + esc(L(UI.games)) + '</h3><p class="sect-sub">' + esc(L(UI.gamesSub)) + '</p><div class="grid">';
  M.games.forEach(function(g){ h += gameCard(g); });
  h += '</div></section>';
  return h;
}

  h += '</div><h3 class="sect-title">' + esc(L(M.levers.h)) + '</h3><div class="tbl-wrap"><table><thead><tr><th>' + (lang === 'pt' ? 'Alavanca' : 'Lever') + '</th><th>' + esc(L(UI.b)) + '</th><th>' + esc(L(UI.a)) + '</th></tr></thead><tbody>';
  M.levers.rows.forEach(function(r){ h += '<tr><td><b>' + esc(L(r[0])) + '</b></td><td>' + esc(L(r[1])) + '</td><td>' + esc(L(r[2])) + '</td></tr>'; });
  h += '</tbody></table></div><h3 class="sect-title">' + esc(L(M.gracie.h)) + '</h3><ol class="principles">' + M.gracie.q.map(function(q){ return '<li><span style="color:var(--ink)">' + esc(L(q)) + '</span></li>'; }).join('') + '</ol><div class="grid"><div class="card"><h4>' + esc(L(M.rot.h)) + '</h4><p>' + esc(L(M.rot.d)) + '</p></div><div class="card"><h4>' + esc(L(M.log.h)) + '</h4><p>' + M.log.q.map(function(q, i){ return (i + 1) + '. ' + esc(L(q)); }).join('<br>') + '</p></div></div>';
  return h;
}

function renderLesson(){
  var M = D[pick.mod], h = '<div class="intro"><div><h2>' + esc(L(UI.nav.lesson)) + '</h2><p>' + (lang === 'pt' ? 'Escolha o módulo, o nível e 2 ou 3 técnicas. O plano com tempos aparece ao lado e pode ser copiado.' : 'Pick the module, the level and 2 or 3 techniques. The timed plan appears alongside and can be copied.') + '</p></div></div>';
  h += '<div class="builder"><div class="card">';
  h += '<div class="field"><label for="selMod">' + (lang === 'pt' ? 'Módulo' : 'Module') + '</label><select id="selMod"><option value="top"' + (pick.mod === 'top' ? ' selected' : '') + '>' + esc(L(D.top.title)) + '</option><option value="bottom"' + (pick.mod === 'bottom' ? ' selected' : '') + '>' + esc(L(D.bottom.title)) + '</option></select></div>';
  h += '<div class="field"><label for="selLv">' + (lang === 'pt' ? 'Nível da turma' : 'Class level') + '</label><select id="selLv"><option value="b"' + (pick.lv === 'b' ? ' selected' : '') + '>' + esc(L(UI.b)) + '</option><option value="a"' + (pick.lv === 'a' ? ' selected' : '') + '>' + esc(L(UI.a)) + '</option></select></div>';
  h += '<div class="field"><label for="selDur">' + (lang === 'pt' ? 'Duração' : 'Length') + '</label><select id="selDur"><option value="60"' + (pick.dur === '60' ? ' selected' : '') + '>60 min</option><option value="90"' + (pick.dur === '90' ? ' selected' : '') + '>90 min</option></select></div>';
  h += '<div class="field"><span class="lbl">' + (lang === 'pt' ? 'Técnicas' : 'Techniques') + '</span><div class="picks" id="picks">';
  M.stages.forEach(function(st, si){
    h += '<div class="grp">' + esc(L(st.name)) + '</div>';
    st.items.forEach(function(it, ii){
      if (pick.lv === 'b' && it.lv === 'a') return;
      var key = si + '-' + ii;
      h += '<label><input type="checkbox" id="pk-' + pick.mod + '-' + key + '" value="' + key + '"' + (pick.items.indexOf(key) > -1 ? ' checked' : '') + '><i class="dot ' + it.lv + '"></i>' + esc(L(it.n)) + '</label>';
    });
  });
  h += '</div></div><div class="field"><label for="selGame">' + (lang === 'pt' ? 'Jogo' : 'Game') + '</label><select id="selGame">';
  M.games.forEach(function(g, gi){ h += '<option value="' + gi + '"' + (+pick.game === gi ? ' selected' : '') + '>' + esc(L(g.n)) + '</option>'; });
  h += '</select></div></div><div class="plan" id="plan"></div></div>';
  return h;
}

function planData(){
  var M = D[pick.mod], is90 = pick.dur === '90';
  var items = pick.items.map(function(k){ var p = k.split('-'); var st = M.stages[+p[0]]; return st && st.items[+p[1]] ? {it: st.items[+p[1]], st: st} : null; }).filter(Boolean);
  var g = M.games[+pick.game] || M.games[0];
  var t = is90 ? [15,5,30,20,15,5] : [10,5,20,15,7,3];
  var lvl = pick.lv === 'b' ? {pt:'30–50%',en:'30–50%'} : {pt:'70–100%',en:'70–100%'};
  var blocks = [
    {m:t[0], h:{pt:'Aquecimento',en:'Warm-up'}, p:pick.mod === 'top' ? {pt:'Movimentos de quadril, postura na guarda, passadas laterais.',en:'Hip movement, guard posture, side steps.'} : {pt:'Fuga de quadril, ponte, giros de guarda.',en:'Hip escapes, bridges, guard spins.'}},
    {m:t[1], h:{pt:'Conceito',en:'Concept'}, p:items.length ? items[0].st.goal : {pt:'Escolha técnicas ao lado.',en:'Pick techniques alongside.'}},
    {m:t[2], h:{pt:'Técnicas',en:'Techniques'}, list:items.length ? items.map(function(x){ return L(x.it.n) + ': ' + L(x.it.t); }) : [lang === 'pt' ? 'Nenhuma técnica escolhida ainda.' : 'No techniques picked yet.'], p:DRILL[pick.lv]},
    {m:t[3], h:{pt:'Jogo: ',en:'Game: '}, hx:L(g.n), p:{pt:L(g.win) + ' · resistência ' + L(lvl), en:L(g.win) + ' · resistance ' + L(lvl)}},
    {m:t[4], h:{pt:'Xadrez BJJ ou ao vivo',en:'BJJ chess or live'}, p:pick.lv === 'b' ? {pt:'Xadrez BJJ com 5 movimentos.',en:'BJJ chess with 5 moves.'} : {pt:'Rounds ao vivo começando na posição da aula.',en:'Live rounds starting from the class position.'}},
    {m:t[5], h:{pt:'Registro',en:'Log'}, p:{pt:METHOD.log.q.map(function(q){ return q.pt; }).join(' '), en:METHOD.log.q.map(function(q){ return q.en; }).join(' ')}}
  ];
  return {M:M, blocks:blocks};
}

function renderPlan(){
  var pd = planData(), el = document.getElementById('plan'); if (!el) return;
  var clock = 0, h = '<h3>' + esc(L(pd.M.title)) + '</h3><div class="meta">' + esc(L(UI[pick.lv])) + ' · ' + pick.dur + ' min</div>';
  pd.blocks.forEach(function(b){
    var start = clock; clock += b.m;
    h += '<div class="block"><div class="t">' + start + '–' + clock + '</div><div><h4>' + esc(L(b.h)) + (b.hx ? esc(b.hx) : '') + ' · ' + b.m + ' min</h4>';
    if (b.list) h += '<ul>' + b.list.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    if (b.p) h += '<p>' + esc(L(b.p)) + '</p>';
    h += '</div></div>';
  });
  h += '<div class="actions"><button type="button" class="primary" id="copyPlan">' + (lang === 'pt' ? 'Copiar plano' : 'Copy plan') + '</button><span class="status" id="copyStatus" role="status"></span></div>';
  h += '<p class="note">' + (lang === 'pt' ? 'Dica: 2 ou 3 técnicas da mesma etapa funcionam melhor do que muitas.' : 'Tip: 2 or 3 techniques from the same stage work better than many.') + '</p>';
  el.innerHTML = h;
}

function planText(){
  var pd = planData(), clock = 0, out = [L(pd.M.title) + ' · ' + L(UI[pick.lv]) + ' · ' + pick.dur + ' min', ''];
  pd.blocks.forEach(function(b){
    var s = clock; clock += b.m;
    out.push(s + '–' + clock + ' min  ' + L(b.h) + (b.hx || ''));
    if (b.list) b.list.forEach(function(x){ out.push('  - ' + x); });
    if (b.p) out.push('  ' + L(b.p));
  });
  return out.join('\n');
}

function render(){
  renderChrome();
  var main = document.getElementById('main');
  if (view === 'top' || view === 'bottom') main.innerHTML = renderModule(view);
  else if (view === 'method') main.innerHTML = renderMethod();
  else { main.innerHTML = renderLesson(); renderPlan(); }
}

function openPanel(mod, si, ii){
  var M = D[mod], st = M.stages[si], it = st.items[ii];
  var nextSt = M.seq ? M.stages[si + 1] : null;
  var h = '<button type="button" class="close" id="closeP" aria-label="' + esc(L(UI.close)) + '">×</button>';
  h += '<span class="lv ' + it.lv + '">' + esc(L(UI[it.lv])) + '</span>' + (it.mine ? ' <span class="mine">★ ' + esc(L(UI.mine)) + '</span>' : '');
  h += '<h3 id="pTitle">' + esc(L(it.n)) + '</h3><div class="from">' + esc(L(M.title)) + ' · ' + esc(L(UI.stage)) + ': ' + esc(L(st.name)) + '</div>';
  h += '<h5>' + esc(L(UI.what)) + '</h5><p>' + esc(L(it.d)) + '</p>';
  if (it.s) h += '<h5>' + esc(L(UI.steps)) + '</h5><ol class="steplist">' + it.s.map(function(x){ return '<li>' + esc(lang === 'pt' ? x[0] : x[1]) + '</li>'; }).join('') + '</ol>';
  h += '<h5>' + esc(L(UI.tip)) + '</h5><p>' + esc(L(it.t)) + '</p>';
  h += '<h5>' + esc(L(UI.drill)) + '</h5><p>' + esc(L(DRILL[it.lv])) + '</p>';
  if (it.g) h += '<p class="note">' + esc(L(UI.ref)) + '</p>';
  if (nextSt) {
    h += '<h5>' + esc(L(UI.nextTo)) + ' · ' + esc(L(nextSt.name)) + '</h5><div class="next">';
    nextSt.items.forEach(function(x, xi){ h += techBtn(mod, si + 1, xi, x).replace(' hidden', ''); });
    h += '</div>';
  }
  var p = document.getElementById('panel');
  p.innerHTML = h; p.hidden = false; document.getElementById('scrim').hidden = false;
  document.getElementById('closeP').focus();
}
function closePanel(){ document.getElementById('panel').hidden = true; document.getElementById('scrim').hidden = true; }

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-lang]');
  if (t) { lang = t.getAttribute('data-lang'); try { localStorage.setItem('sg-lang', lang); } catch (er) {} closePanel(); render(); return; }
  t = e.target.closest('[data-level]');
  if (t) { level = t.getAttribute('data-level'); render(); return; }
  t = e.target.closest('.tech');
  if (t) { openPanel(t.getAttribute('data-m'), +t.getAttribute('data-s'), +t.getAttribute('data-i')); return; }
  if (e.target.id === 'closeP' || e.target.id === 'scrim') { closePanel(); return; }
  if (e.target.id === 'copyPlan') {
    var txt = planText(), st = document.getElementById('copyStatus');
    var done = function(){ st.textContent = lang === 'pt' ? 'Copiado' : 'Copied'; };
    var fail = function(){ st.textContent = lang === 'pt' ? 'Não deu para copiar; selecione o texto do plano.' : "Couldn't copy; select the plan text instead."; };
    try { navigator.clipboard.writeText(txt).then(done, fail); } catch (er) { fail(); }
  }
});
document.addEventListener('change', function(e){
  var id = e.target.id;
  if (id === 'selMod') { pick.mod = e.target.value; pick.items = []; pick.game = 0; savePick(); render(); return; }
  if (id === 'selLv') { pick.lv = e.target.value; if (pick.lv === 'b') { var M = D[pick.mod]; pick.items = pick.items.filter(function(k){ var p = k.split('-'); return M.stages[+p[0]].items[+p[1]].lv === 'b'; }); } savePick(); render(); return; }
  if (id === 'selDur') { pick.dur = e.target.value; savePick(); renderPlan(); return; }
  if (id === 'selGame') { pick.game = +e.target.value; savePick(); renderPlan(); return; }
  if (e.target.closest('#picks')) {
    pick.items = Array.prototype.map.call(document.querySelectorAll('#picks input:checked'), function(x){ return x.value; });
    savePick(); renderPlan();
  }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closePanel(); });

function route(){
  var h = (location.hash || '').replace('#', '');
  view = ['top','bottom','lesson','method'].indexOf(h) > -1 ? h : 'top';
  closePanel(); render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
if (!pick.items.length) { pick.items = ['0-0','0-1','1-0']; }
route();
</script>
