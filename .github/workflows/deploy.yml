name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Data files are valid JSON
        run: |
          for f in data/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::not valid JSON"; exit 1; }
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Content checks plus the database rules, run against a local copy of Firestore.
      - name: Tests
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          npm test

      # Opens the site in Chrome and uses it: a page that would load blank fails here, before it is published.
      - name: The site works in a real browser
        run: |
          npm install --no-save playwright-core@1.65.1
          python3 -m http.server 8000 > /dev/null 2>&1 &
          curl --silent --output /dev/null --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8000/
          npm run smoke -- http://localhost:8000

  # Runs only after "check" passes, and only for main. Google accepts this job's
  # identity token for main of this repository and nothing else, so no keys live here.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/25668106993/locations/global/workloadIdentityPools/github/providers/sistema-guarda-bjj
          service_account: sg-deploy@sistema-guarda-515619.iam.gserviceaccount.com

      - name: Publish the site and the database rules
        run: npx --yes firebase-tools@15.35.0 deploy --only hosting,firestore:rules --project sistema-guarda-515619 --non-interactive

  # A separate job on purpose: it installs a package and runs a browser, so it gets no Google identity.
  published:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: The published site works in a real browser
        run: |
          npm install --no-save playwright-core@1.65.1
          npm run smoke -- https://sistemaguarda.com
