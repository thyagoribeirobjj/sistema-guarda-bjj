name: Nightly checks

# Every night: is the site up, safe, free, and the same as main? A failure opens one issue here,
# and the issue closes itself on the next night that passes. Nothing in this workflow changes anything.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Reads from Google with the publish identity. It runs only this repository's own code: no packages.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      failed: ${{ steps.run.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: google
        with:
          workload_identity_provider: projects/25668106993/locations/global/workloadIdentityPools/github/providers/sistema-guarda-bjj
          service_account: sg-deploy@sistema-guarda-515619.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - name: The published site is up, safe, free and the same as main
        id: run
        env:
          GOOGLE_TOKEN: ${{ steps.google.outputs.access_token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node tests/nightly.mjs 2>&1 | tee checks.txt || status=$?
          { echo 'failed<<END_OF_CHECKS'; grep -E '^FAIL' checks.txt || true; echo 'END_OF_CHECKS'; } >> "$GITHUB_OUTPUT"
          exit "${status:-0}"

  # Installs a package and runs a browser, so it gets no Google identity.
  browser:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.run.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: The published site works in a real browser
        id: run
        run: |
          npm ci
          set -o pipefail
          node tests/smoke.mjs https://sistemaguarda.com 2>&1 | tee browser.txt || status=$?
          { echo 'failed<<END_OF_CHECKS'; grep -E '^(FAIL|- )' browser.txt || true; echo 'END_OF_CHECKS'; } >> "$GITHUB_OUTPUT"
          exit "${status:-0}"

  report:
    needs: [checks, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue on failure, close it once the checks pass again
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED: ${{ needs.checks.result == 'success' && needs.browser.result == 'success' }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CHECKS: ${{ needs.checks.outputs.failed }}
          BROWSER: ${{ needs.browser.outputs.failed }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly check failed"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title --jq ".[] | select(.title == \"$title\") | .number")
          if [ "$PASSED" = true ]; then
            for number in $open; do gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Tonight's checks all passed: $RUN"; done
            exit 0
          fi
          if [ -n "$open" ]; then exit 0; fi
          if [ "$CHECKS_RESULT" != success ] && [ -z "$CHECKS" ]; then CHECKS="The Google-side checks did not run ($CHECKS_RESULT)."; fi
          if [ "$BROWSER_RESULT" != success ] && [ -z "$BROWSER" ]; then BROWSER="The browser check did not run ($BROWSER_RESULT)."; fi
          failed=$(printf '%s\n%s\n' "$CHECKS" "$BROWSER" | sed '/^$/d')
          {
            echo "The nightly checks of sistemaguarda.com found a problem. This issue closes itself on the next night they all pass."
            echo
            echo '```'
            echo "${failed:-The checks could not run. See the run.}"
            echo '```'
            echo
            echo "Run: $RUN"
          } > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue.md
